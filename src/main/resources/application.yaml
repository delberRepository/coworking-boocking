server:
  port: ${PORT:8080}

spring:
  application:
    name: coworking-booking

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD} 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # Esto hace que el SQL en consola sea legible

  jackson: # Ya no lleva "spring:" delante porque ya estamos dentro del bloque spring
    serialization:
      indent-output: true

springdoc: # en true para ver los endpoint con swagger
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app: #para poder comunicarse con react
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:mi_clave_super_segura_de_al_menos_32_caracteres_123}
