<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coworking Booking | Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<main class="page">
    <section class="hero">
        <div class="hero__copy">
            <p class="eyebrow">Coworking Booking</p>
            <h1>Accede a tu espacio de reservas</h1>
            <p class="lead">
                Esta pantalla usa Thymeleaf para renderizar la vista y llama al endpoint real
                <code>/auth/login</code> para obtener el JWT.
            </p>
        </div>
    </section>

    <section class="panel">
        <div class="panel__header">
            <h2>Iniciar sesion</h2>
            <p>Introduce un usuario existente para probar la autenticacion.</p>
        </div>

        <form id="login-form" class="login-form">
            <label class="field">
                <span>Email</span>
                <input id="email" name="email" type="email" placeholder="user@example.com" required>
            </label>

            <label class="field">
                <span>Contrasena</span>
                <input id="password" name="password" type="password" placeholder="******" required>
            </label>

            <button id="submit-button" type="submit">Entrar</button>
        </form>

        <div id="status-box" class="status-box" aria-live="polite"></div>

        <div class="token-card">
            <div class="token-card__header">
                <h3>JWT recibido</h3>
                <button id="copy-token" type="button" class="ghost-button" disabled>Copiar</button>
            </div>
            <textarea id="token-output" readonly placeholder="El token aparecera aqui tras un login correcto"></textarea>
        </div>
    </section>
</main>

<script th:src="@{/js/login.js}" src="/js/login.js"></script>
</body>
</html>
